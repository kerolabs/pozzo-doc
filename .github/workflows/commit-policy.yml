name: Commit policy

on:
  push:
  pull_request:

jobs:
  # Do not rename this job: it is the required status check on main and develop.
  commit-policy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          # Only the commits that are new to the target branch are checked.
          # A push to a brand-new branch has no "before", so its commits are
          # measured against develop (or main, for develop itself).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            if [ "${{ github.ref_name }}" != "develop" ] && git rev-parse --verify -q origin/develop >/dev/null; then
              range="origin/develop..HEAD"
            elif git rev-parse --verify -q origin/main >/dev/null; then
              range="origin/main..HEAD"
            else
              range="HEAD"
            fi
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi

          echo "Checking: $range"

          # The course requires Conventional Commits: a type, a colon, a space
          # and a description, in English. Merge and revert commits are
          # generated by git and GitHub and are exempt.
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          subject="^($types)(\([a-z0-9._/-]+\))?!?: [^ ].+"

          # Commits are authored by team members. Tools that add themselves as
          # co-authors or sign the message are not authors and their trailers
          # must be removed before pushing.
          trailer='^(Co-authored-by|Signed-off-by):.*(claude|copilot|chatgpt|openai|anthropic|gemini|cursor|codeium|devin|tabnine)|Generated with.*(Claude|Copilot|ChatGPT|Gemini|Cursor)'

          status=0

          for sha in $(git rev-list --no-merges "$range"); do
            first=$(git log -1 --format='%s' "$sha")
            body=$(git log -1 --format='%B' "$sha")

            case "$first" in
              Merge\ *|Revert\ \"*) continue ;;
            esac

            if ! printf '%s\n' "$first" | grep -qE "$subject"; then
              echo "::error::$sha does not follow Conventional Commits: \"$first\""
              status=1
            fi

            if printf '%s\n' "$body" | grep -qiE "$trailer"; then
              echo "::error::$sha carries a tool trailer that must be removed: \"$first\""
              status=1
            fi
          done

          if [ "$status" -eq 0 ]; then
            echo "All commits follow the policy."
          fi

          exit $status
