name: Report PDF

on:
  push:
    tags:
      - 'av1*'
      - 'tb1*'
      - 'av2*'
      - 'tb2*'
  workflow_dispatch:
    inputs:
      delivery:
        description: Delivery to build
        type: choice
        options: [av1, tb1, av2, tb2]
        required: true

permissions:
  contents: write

env:
  PANDOC_VERSION: '3.10'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the delivery
        id: delivery
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.delivery }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME:0:3}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Pandoc
        run: |
          curl -fsSL -o pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i pandoc.deb
          rm pandoc.deb
          pandoc --version | head -1

      - name: Install XeLaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-spanish \
            lmodern \
            fonts-texgyre

      - name: Check the TeX Gyre Termes font
        run: |
          echo "--- fontconfig ---"
          fc-list | grep -i "gyre" || echo "(no matches)"
          echo "--- texmf ---"
          kpsewhich texgyretermes-regular.otf || echo "(not in the texmf tree)"
          if ! fc-list | grep -qi "TeX Gyre Termes"; then
            echo "::error::TeX Gyre Termes is not available on the runner"
            exit 1
          fi

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 ${{ steps.delivery.outputs.value }}

      - name: Upload the PDF as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ steps.delivery.outputs.value }}
          path: dist/*.pdf

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.pdf \
            --title "Informe ${{ steps.delivery.outputs.value }}" \
            --notes "PDF generado automaticamente desde el tag $GITHUB_REF_NAME."
