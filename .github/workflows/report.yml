name: Report

on:
  push:
    tags:
      - 'av1*'
      - 'tb1*'
      - 'av2*'
      - 'tb2*'
  workflow_dispatch:
    inputs:
      delivery:
        description: Delivery to build
        type: choice
        options: [av1, tb1, av2, tb2]
        required: true

permissions:
  contents: write

env:
  PANDOC_VERSION: '3.10'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the delivery
        id: delivery
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.delivery }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME:0:3}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Pandoc
        run: |
          curl -fsSL -o pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i pandoc.deb
          rm pandoc.deb
          pandoc --version | head -1

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 ${{ steps.delivery.outputs.value }}

      # Los runners no tienen Microsoft Word, asi que aqui sale solo el .docx.
      # El PDF de la entrega se exporta con Word en una maquina del equipo
      # (scripts/build.ps1 lo hace solo) y se sube a mano al release.
      - name: Upload the Word document as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ steps.delivery.outputs.value }}
          path: dist/*.docx

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.docx \
            --title "Informe ${{ steps.delivery.outputs.value }}" \
            --notes "Documento de Word generado desde el tag $GITHUB_REF_NAME. El PDF de la entrega se exporta desde Word y se adjunta a este release."
